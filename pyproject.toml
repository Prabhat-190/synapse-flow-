[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse-flow"
version = "1.0.0"
description = "SynapseFlow: Structured Intelligence Network for Agent Pipeline Execution — production multi-agent LLM orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Prabhat Kumar", email = "sauravsandilya7367905043@gmail.com" }]
keywords = ["langgraph", "multi-agent", "llm", "rag", "orchestration", "fastapi", "agentic-ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "google-generativeai>=0.8.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.6",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-client>=0.21.0",
    "tenacity>=9.0.0",
    "python-jose[cryptography]>=3.3.0",
    "sse-starlette>=2.1.0",
    "tiktoken>=0.8.0",
    "numpy>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/Prabhat-190/synapse-flow-"
Repository = "https://github.com/Prabhat-190/synapse-flow-"
Documentation = "https://github.com/Prabhat-190/synapse-flow-/blob/main/docs/ARCHITECTURE.md"
Issues = "https://github.com/Prabhat-190/synapse-flow-/issues"

[project.scripts]
synapse = "synapse.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
